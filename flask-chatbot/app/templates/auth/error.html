{% extends "base.html" %}
{% block title %}Auth Error — bomiq SDM{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow mx-auto" style="max-width:480px;">
    <div class="card-body p-4">
      <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
      <h4 class="fw-bold">Authentication Error</h4>
      <p class="text-muted">{{ error }}</p>
      {% if description %}<p class="small text-danger">{{ description }}</p>{% endif %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-2">
        <i class="bi bi-arrow-repeat me-1"></i>Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
