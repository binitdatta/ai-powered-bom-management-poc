<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: layout(~{::title}, ~{::content})}">
<head><title th:text="'Edit: ' + ${bom.bomNumber}">Edit BOM</title></head>
<body>
<th:block th:fragment="content">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="mb-0">
      <i class="bi bi-pencil-square me-2 text-primary"></i>
      Edit BOM — <span th:text="${bom.bomNumber}">BOM</span>
    </h5>
    <a th:href="@{/bom/{id}(id=${bom.id})}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-x-lg me-1"></i>Cancel
    </a>
  </div>

  <form th:action="@{/bom/{id}/edit(id=${bom.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="row g-3">

      <!-- ── Identity ─────────────────────────────────────────────── -->
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-primary text-white py-2 small fw-semibold">
            <i class="bi bi-card-text me-1"></i>Identity
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small">BOM Title *</label>
                <input type="text" name="bomTitle" class="form-control form-control-sm"
                       th:value="${bom.bomTitle}" required/>
              </div>
              <div class="col-md-2">
                <label class="form-label small">Revision *</label>
                <input type="text" name="bomRevision" class="form-control form-control-sm"
                       th:value="${bom.bomRevision}" required maxlength="10"/>
              </div>
              <div class="col-md-3">
                <label class="form-label small">BOM Type</label>
                <select name="bomType" class="form-select form-select-sm">
                  <option th:each="t : ${bomTypes}"
                          th:value="${t.name()}"
                          th:text="${t.name()}"
                          th:selected="${bom.bomType == t}">TYPE</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Status</label>
                <select name="bomStatus" class="form-select form-select-sm">
                  <option th:each="s : ${statuses}"
                          th:value="${s.name()}"
                          th:text="${s.name()}"
                          th:selected="${bom.bomStatus == s}">STATUS</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small">ECN Number</label>
                <input type="text" name="engineeringChangeNo" class="form-control form-control-sm"
                       th:value="${bom.engineeringChangeNo}" maxlength="50"/>
              </div>
              <div class="col-md-8">
                <label class="form-label small">Change Description</label>
                <input type="text" name="changeDescription" class="form-control form-control-sm"
                       th:value="${bom.changeDescription}"/>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Dates & Scheduling ────────────────────────────────────── -->
      <div class="col-12 col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-info text-white py-2 small fw-semibold">
            <i class="bi bi-calendar3 me-1"></i>Dates &amp; Scheduling
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small">Effective Date</label>
                <input type="date" name="effectiveDate" class="form-control form-control-sm"
                       th:value="${bom.effectiveDate}"/>
              </div>
              <div class="col-6">
                <label class="form-label small">Expiry Date</label>
                <input type="date" name="expiryDate" class="form-control form-control-sm"
                       th:value="${bom.expiryDate}"/>
              </div>
              <div class="col-6">
                <label class="form-label small">Costing Date</label>
                <input type="date" name="costingDate" class="form-control form-control-sm"
                       th:value="${bom.costingDate}"/>
              </div>
              <div class="col-6">
                <label class="form-label small">Assembly Time (min)</label>
                <input type="number" name="targetAssemblyTimeMin" class="form-control form-control-sm"
                       th:value="${bom.targetAssemblyTimeMin}" min="0"/>
              </div>
              <div class="col-12">
                <label class="form-label small">Assembly Location</label>
                <input type="text" name="assemblyLocation" class="form-control form-control-sm"
                       th:value="${bom.assemblyLocation}" maxlength="100"/>
              </div>
              <div class="col-12">
                <label class="form-label small">Quality Plan Ref</label>
                <input type="text" name="qualityPlanRef" class="form-control form-control-sm"
                       th:value="${bom.qualityPlanRef}" maxlength="50"/>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Cost & Weight ─────────────────────────────────────────── -->
      <div class="col-12 col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-success text-white py-2 small fw-semibold">
            <i class="bi bi-currency-dollar me-1"></i>Cost &amp; Physical
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small">Material Cost</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">$</span>
                  <input type="number" name="totalMaterialCost" class="form-control form-control-sm"
                         th:value="${bom.totalMaterialCost}" step="0.0001" min="0"/>
                </div>
              </div>
              <div class="col-6">
                <label class="form-label small">Labor Cost</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">$</span>
                  <input type="number" name="totalLaborCost" class="form-control form-control-sm"
                         th:value="${bom.totalLaborCost}" step="0.0001" min="0"/>
                </div>
              </div>
              <div class="col-6">
                <label class="form-label small">Overhead Cost</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">$</span>
                  <input type="number" name="totalOverheadCost" class="form-control form-control-sm"
                         th:value="${bom.totalOverheadCost}" step="0.0001" min="0"/>
                </div>
              </div>
              <div class="col-6">
                <label class="form-label small">Total BOM Cost</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">$</span>
                  <input type="number" name="totalBomCost" class="form-control form-control-sm"
                         th:value="${bom.totalBomCost}" step="0.0001" min="0"/>
                </div>
              </div>
              <div class="col-4">
                <label class="form-label small">Currency</label>
                <input type="text" name="currencyCode" class="form-control form-control-sm"
                       th:value="${bom.currencyCode}" maxlength="3"/>
              </div>
              <div class="col-4">
                <label class="form-label small">Weight (kg)</label>
                <input type="number" name="weightKg" class="form-control form-control-sm"
                       th:value="${bom.weightKg}" step="0.0001" min="0"/>
              </div>
              <div class="col-4">
                <label class="form-label small">Volume (cm³)</label>
                <input type="number" name="volumeCm3" class="form-control form-control-sm"
                       th:value="${bom.volumeCm3}" step="0.0001" min="0"/>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Approval & Risk ────────────────────────────────────────── -->
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-warning text-dark py-2 small fw-semibold">
            <i class="bi bi-shield-check me-1"></i>Approval &amp; Risk
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label small">Risk Level</label>
                <select name="riskLevel" class="form-select form-select-sm">
                  <option value="">— Select —</option>
                  <option th:each="r : ${riskLevels}"
                          th:value="${r.name()}"
                          th:text="${r.name()}"
                          th:selected="${bom.riskLevel == r}">RISK</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Approval Required By</label>
                <input type="text" name="approvalRequiredBy" class="form-control form-control-sm"
                       th:value="${bom.approvalRequiredBy}" maxlength="100"/>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Notes</label>
                <textarea name="notes" class="form-control form-control-sm" rows="2"
                          th:text="${bom.notes}"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Actions ───────────────────────────────────────────────── -->
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a th:href="@{/bom/{id}(id=${bom.id})}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-floppy me-1"></i>Save Changes
        </button>
      </div>

    </div><!-- /row -->
  </form>

</th:block>
</body>
</html>
