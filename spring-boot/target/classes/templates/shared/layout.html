<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' | bomiq SDM'">bomiq SDM</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Custom light-blue theme -->
  <link th:href="@{/css/bomiq.css}" rel="stylesheet"/>
</head>
<body class="bomiq-body">

<!-- ── Navbar ──────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark bomiq-navbar sticky-top">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/bom}">
      <i class="bi bi-layers-half fs-5"></i>
      <span class="fw-semibold">bomiq <span class="text-info">SDM</span></span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" th:href="@{/bom}"
             th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('/bom')} ? 'active' : ''">
            <i class="bi bi-list-ul me-1"></i>BOMs
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/components}"
             th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('/component')} ? 'active' : ''">
            <i class="bi bi-cpu me-1"></i>Components
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/suppliers}"
             th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('/supplier')} ? 'active' : ''">
            <i class="bi bi-building me-1"></i>Suppliers
          </a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-gear me-1"></i>Admin
          </a>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" th:href="@{/bom/new}">
              <i class="bi bi-plus-circle me-1"></i>New BOM</a></li>
            <li><hr class="dropdown-divider"/></li>
            <li><a class="dropdown-item" th:href="@{/actuator/health}" target="_blank">
              <i class="bi bi-heart-pulse me-1"></i>Health</a></li>
          </ul>
        </li>
      </ul>

      <!-- Search -->
      <form class="d-flex me-3" th:action="@{/bom}" method="get">
        <div class="input-group input-group-sm">
          <input class="form-control bomiq-search" type="search" name="q"
                 placeholder="Search BOMs…" aria-label="Search"/>
          <button class="btn btn-outline-info" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>

      <!-- User menu -->
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#"
             data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i>
            <span th:text="${user} ?: 'User'" class="d-none d-md-inline small"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
            <li class="dropdown-item-text small text-muted" th:text="${user}">username</li>
            <li><hr class="dropdown-divider"/></li>
            <li>
              <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="dropdown-item text-danger">
                  <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Flash messages ──────────────────────────────────────────────── -->
<div class="container-fluid mt-2" th:if="${successMsg}">
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-1"></i>
    <span th:text="${successMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>
<div class="container-fluid mt-2" th:if="${errorMsg}">
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i>
    <span th:text="${errorMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- ── Main content ────────────────────────────────────────────────── -->
<main class="container-fluid py-3">
  <th:block th:replace="${content}"/>
</main>

<!-- ── Footer ─────────────────────────────────────────────────────── -->
<footer class="bomiq-footer mt-auto py-2 text-center small text-muted">
  bomiq SDM v1.0 &nbsp;|&nbsp;
  <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span>
  &copy; Enterprise POC
  &nbsp;|&nbsp;
  <a th:href="@{/api/v1/public/health}" target="_blank" class="text-muted">API</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/bomiq.js}"></script>
</body>
</html>
