server:
  port: 9086
  servlet:
    context-path: /bomiq

spring:
  application:
    name: bomiq-sdm

  datasource:
    url: jdbc:mysql://localhost:3306/bomiq_sdm
    username: root
    password: localroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BomIqHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 20

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bomiq-sdm
            client-secret: "none"
            scope: openid, profile, email, roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            client-authentication-method: none
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/bomiq
            user-name-attribute: preferred_username
            authorization-uri: http://localhost:8080/realms/bomiq/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/bomiq/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8080/realms/bomiq/protocol/openid-connect/certs
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bomiq
          jwk-set-uri: http://localhost:8080/realms/bomiq/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.bomiq: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

bomiq:
  app:
    name: BomIQ SDM
    version: 1.0.0
  keycloak:
    realm: bomiq
    admin-role: bomiq-admin
    engineer-role: bomiq-engineer
    viewer-role: bomiq-viewer